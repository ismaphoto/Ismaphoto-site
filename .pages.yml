
media:
  - name: photos
    label: Mes photographies
    input: images
    output: /images
    categories: [image]
    rename: safe

content:
  - name: galerie
    label: Galerie photographique
    type: file
    path: data/galerie.json
    format: json
    list: true
    fields:
      - name: titre
        label: Titre de la photographie
        type: string
      - name: categorie
        label: Catégorie
        type: select
        options:
          values:
            - Automobile
            - Portrait
            - Produit et studio
      - name: photo
        label: Photographie
        type: image
        options:
          media: photos

  - name: accueil
    label: Photo d'accueil
    type: file
    path: data/accueil.json
    format: json
    fields:
      - name: photo
        label: Photographie principale
        type: image
        options:
          media: photos
      - name: description
        label: Description de l'image
        type: string

      - name: photo_automobile
        label: Image catégorie Automobile
        type: image
        options:
          media: photos
      - name: photo_portrait
        label: Image catégorie Portrait
        type: image
        options:
          media: photos
      - name: photo_produit
        label: Image catégorie Produit et Studio
        type: image
        options:
          media: photos
